<svg viewBox='0 0 120 180' width='110' height='165' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <!-- 平面木質切面漸層 -->
    <linearGradient id='flatWood' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#D98880'/>
      <stop offset='35%' stop-color='#CD6155'/>
      <stop offset='70%' stop-color='#B03A2E'/>
      <stop offset='100%' stop-color='#78281F'/>
    </linearGradient>
    <filter id='dropShadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='6' stdDeviation='5' flood-color='#000000' flood-opacity='0.6'/>
    </filter>
  </defs>
  
  <!-- 外輪廓切面 -->
  <path d='M35,15 C85,30 110,95 95,160 C75,170 50,160 38,125 C25,90 15,45 35,15 Z' 
        fill='url(#flatWood)' stroke='#511510' stroke-width='3.5' filter='url(#dropShadow)'/>
  
  <!-- 平整內邊線 (強調剖面平整感) -->
  <path d='M38,22 C80,35 102,95 88,152 C72,160 52,152 42,122 C30,90 22,50 38,22 Z' 
        fill='#C0392B' stroke='#E6B0AA' stroke-width='1.5' stroke-dasharray='4,2' opacity='0.7'/>
  
  <!-- 清晰的木年輪 / 竹節平剖橫紋 -->
  <path d='M42,40 C65,55 85,60 92,62' stroke='#FADBD8' stroke-width='2' fill='none' opacity='0.6'/>
  <path d='M40,65 C62,80 82,90 89,95' stroke='#FADBD8' stroke-width='2.5' fill='none' opacity='0.6'/>
  <path d='M38,90 C58,105 76,118 84,128' stroke='#FADBD8' stroke-width='2' fill='none' opacity='0.6'/>
  <path d='M42,115 C58,128 70,138 78,145' stroke='#FADBD8' stroke-width='1.8' fill='none' opacity='0.6'/>
</svg>