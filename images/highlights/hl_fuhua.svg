  <rect x="40" y="295" width="520" height="75" rx="6" fill="#1A0507" fill-opacity="0.8" stroke="#D4AF37" stroke-width="1" opacity="0.95"/>
  <text x="300" y="326" font-family="'LXGW WenKai TC', 'DFKai-SB', 'BiauKai', '標楷體', serif" font-size="19" font-weight="bold" fill="#FFF1B0" text-anchor="middle" letter-spacing="2">雷祖扶鸞降筆聖訓傳道</text>
  <text x="300" y="352" font-family="'LXGW WenKai TC', 'DFKai-SB', 'BiauKai', '標楷體', serif" font-size="13" fill="#D1C5B4" text-anchor="middle" letter-spacing="1">桃木為筆．柳木為乩 ｜ 本宮鸞生虔誠扶鸞，天尊降訓化育群品、指點迷津。</text>
