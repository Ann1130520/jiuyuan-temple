<svg viewBox='0 0 120 180' width='110' height='165' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <!-- 凸面飽滿圓弧深沉漸層 -->
    <radialGradient id='roundShade' cx='40%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#E74C3C'/>
      <stop offset='30%' stop-color='#922B21'/>
      <stop offset='70%' stop-color='#641E16'/>
      <stop offset='100%' stop-color='#2C0805'/>
    </radialGradient>
    <filter id='glowRound' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='8' stdDeviation='6' flood-color='#000000' flood-opacity='0.7'/>
    </filter>
  </defs>

  <!-- 渾厚半月隆起主體 -->
  <path d='M35,15 C85,30 110,95 95,160 C75,170 50,160 38,125 C25,90 15,45 35,15 Z' 
        fill='url(#roundShade)' stroke='#200503' stroke-width='3.5' filter='url(#glowRound)'/>

  <!-- 凸起的脊背高光線條 (強烈立體弧度光澤) -->
  <path d='M42,25 C75,45 88,85 78,145' stroke='#FFFFFF' stroke-width='6' stroke-linecap='round' fill='none' opacity='0.55' filter='blur(1px)'/>
  <path d='M42,25 C75,45 88,85 78,145' stroke='#FADBD8' stroke-width='3' stroke-linecap='round' fill='none' opacity='0.85'/>

  <!-- 竹頭筍節凸起節痕 -->
  <path d='M48,55 Q62,62 76,60' stroke='#3E0F0A' stroke-width='3' fill='none' opacity='0.6'/>
  <path d='M45,100 Q58,110 72,108' stroke='#3E0F0A' stroke-width='3' fill='none' opacity='0.6'/>
</svg>